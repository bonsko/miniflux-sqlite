name: Nix bootstrap
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  hash:
    name: resolve vendorHash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Lock
        run: nix flake lock --print-build-logs
      - name: Resolve vendor hash
        run: |
          set +e
          nix build .#default --print-build-logs 2>&1 | tee build.log
          echo "---- expected vendorHash ----"
          grep -oE 'got: *sha256-[A-Za-z0-9+/=]+' build.log | tail -1
      - name: Upload lock file
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: error
